<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Text Selection Translator 设置</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        color: #333;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 420px;
        margin-bottom: 16px;
      }
      .field span {
        color: #666;
      }
      input,
      select {
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        padding: 6px 16px;
        border: none;
        border-radius: 4px;
        background: #2196f3;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #1976d2;
      }
      #status {
        color: #2e7d32;
      }
      .hint {
        margin-top: 20px;
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Text Selection Translator</h1>

    <label class="field">
      <span>DeepSeek API Key（选择 DeepSeek 翻译源时必填）</span>
      <input id="deepseek-key" type="password" placeholder="sk-..." />
    </label>

    <label class="field">
      <span>默认翻译源（面板上切换后会记住）</span>
      <select id="source">
        <option value="google">Google 翻译（免 Key）</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </label>

    <label class="field">
      <span>目标语言</span>
      <select id="target"></select>
    </label>

    <div class="actions">
      <button id="save" type="button">保存</button>
      <span id="status"></span>
    </div>

    <p class="hint">
      单个英文单词的译文会缓存在本地词典里，之后同样的单词不再请求翻译接口。
    </p>

    <script src="options.js"></script>
  </body>
</html>
